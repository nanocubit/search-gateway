version: '3.8'

services:
  search-gateway:
    build: .
    volumes:
      - .:/app
    working_dir: /app
    command: sh -c "composer install && composer test"
    environment:
      - YANDEX_SEARCH_ENABLED=false
      - BRAVE_SEARCH_ENABLED=false
      - SEARCH_CACHE_ENABLED=true
      - SEARCH_RETRY_ENABLED=true

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
