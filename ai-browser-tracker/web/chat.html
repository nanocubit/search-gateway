<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chat — AI Browser Tracker</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/styles/github-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/highlight.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/5.1.1/marked.min.js"></script>
    <style>
        :root {
            --bg: #0f0f1a;
            --surface: #1e1e2e;
            --text: #e0e0f0;
            --accent: #cba6f7;
            --user-bg: #313244;
            --assistant-bg: #45475a;
            --border: #313244;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            height: 100vh;
        }
        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            max-width: 900px;
            margin: 0 auto;
            width: 100%;
        }
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 15px;
            line-height: 1.5;
            word-break: break-word;
        }
        .message.user {
            align-self: flex-end;
            background: var(--user-bg);
            border-bottom-right-radius: 4px;
        }
        .message.assistant {
            align-self: flex-start;
            background: var(--assistant-bg);
            border-bottom-left-radius: 4px;
        }
        .message pre {
            background: #111;
            border-radius: 8px;
            padding: 12px;
            overflow-x: auto;
            margin: 8px 0;
        }
        .message code {
            font-family: 'Fira Code', 'Consolas', monospace;
            font-size: 13px;
        }
        .message p { margin: 6px 0; }
        .message ul, .message ol { margin: 6px 0; padding-left: 20px; }
        .message blockquote {
            border-left: 3px solid #cba6f7;
            padding-left: 10px;
            color: #a6adc8;
            margin: 8px 0;
        }
        .input-area {
            display: flex;
            padding: 15px 20px;
            background: var(--surface);
            border-top: 1px solid var(--border);
            align-items: flex-end;
            gap: 10px;
        }
        #user-input {
            flex: 1;
            padding: 10px 14px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: #181825;
            color: var(--text);
            font-size: 15px;
            resize: none;
            font-family: inherit;
        }
        #user-input:focus { outline: none; border-color: var(--accent); }
        button {
            background: var(--accent);
            color: #1e1e2e;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
            transition: opacity 0.2s;
        }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        button:hover:not(:disabled) { opacity: 0.9; }
        .controls {
            display: flex;
            gap: 10px;
            align-items: center;
            padding: 12px 20px;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            flex-wrap: wrap;
        }
        select, input[type="text"] {
            background: #313244;
            color: var(--text);
            border: 1px solid var(--border);
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
        }
        select:focus, input[type="text"]:focus { outline: none; border-color: var(--accent); }
        .typing {
            align-self: flex-start;
            background: var(--assistant-bg);
            padding: 12px 16px;
            border-radius: 12px;
            display: none;
            font-style: italic;
            color: #a6adc8;
        }
        a { color: #89b4fa; text-decoration: none; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="controls">
            <select id="model-select">
                <option value="qwen2.5:3b">Qwen 2.5 3B</option>
                <option value="llama3.2">Llama 3.2</option>
                <option value="deepseek-coder">DeepSeek Coder</option>
            </select>
            <input type="text" id="system-prompt" placeholder="Системный промпт (пусто = по умолчанию)" style="flex:1; min-width:150px">
            <button id="clear-history">Очистить</button>
            <a href="/"><button>Дашборд</button></a>
        </div>
        <div class="messages" id="messages">
            <div class="typing" id="typing-indicator">Печатает...</div>
        </div>
        <div class="input-area">
            <textarea id="user-input" rows="2" placeholder="Напишите сообщение... (Shift+Enter — новая строка)"></textarea>
            <button id="send-btn">Send</button>
        </div>
    </div>
    <script src="chat.js"></script>
</body>
</html>
